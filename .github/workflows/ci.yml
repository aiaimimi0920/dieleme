name: Crow quality
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_DB: crow_quality
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -c "import cv2, ddddocr, numpy, onnxruntime"
      - run: python scripts/generate_auth_recovery_codes.py --check
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/collection_api_credentials.py tools/test/test_collection_api_credentials.py tools/internal_api_http.py
      - run: python -m ruff format --check src/collection_api_credentials.py tools/test/test_collection_api_credentials.py tools/internal_api_http.py
      - run: python -m mypy --strict --follow-imports skip src/collection_api_credentials.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B tools/pc1_desktop_recovery.py tools/pc1_recovery_request.py tools/test/test_recovery_client_transport.py tools/test/test_pc1_watcher_transport.py
      - run: python -m ruff format --check tools/pc1_desktop_recovery.py tools/pc1_recovery_request.py tools/test/test_recovery_client_transport.py tools/test/test_pc1_watcher_transport.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B tools/test/test_desktop_api_configuration.py tools/test/test_pc1_python_resolution.py
      - run: python -m ruff format --check tools/test/test_desktop_api_configuration.py tools/test/test_pc1_python_resolution.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/server_route_access.py src/collection_operator_actions.py tools/test/test_collection_node_credentials.py
      - run: python -m ruff format --check src/server_route_access.py src/collection_operator_actions.py tools/test/test_collection_node_credentials.py
      - run: python -m mypy --strict --follow-imports skip src/server_route_access.py src/collection_operator_actions.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/collection_maintenance_options.py tools/test/test_maintenance_write_boundary.py tools/test/test_item_resource_errors.py
      - run: python -m ruff format --check src/collection_maintenance_options.py tools/test/test_maintenance_write_boundary.py tools/test/test_item_resource_errors.py
      - run: python -m mypy --strict --follow-imports skip src/collection_maintenance_options.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B check_server.py unpause_check.py tools/test/test_collection_diagnostic_clients.py
      - run: python -m ruff format --check check_server.py unpause_check.py tools/test/test_collection_diagnostic_clients.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/auth_recovery_codes.py src/captcha_dom.py src/captcha_pointer_backend.py scripts/generate_auth_recovery_codes.py tools/test/test_auth_recovery_code_generation.py tools/test/test_captcha_dom_evaluation.py tools/test/test_captcha_pointer_backend.py tools/test/test_desktop_settings_bundle.py
      - run: python -m ruff format --check src/auth_recovery_codes.py src/captcha_dom.py src/captcha_pointer_backend.py scripts/generate_auth_recovery_codes.py tools/test/test_auth_recovery_code_generation.py tools/test/test_captcha_dom_evaluation.py tools/test/test_captcha_pointer_backend.py tools/test/test_desktop_settings_bundle.py
      - run: python -m mypy --strict --follow-imports skip src/auth_recovery_codes.py src/captcha_dom.py src/captcha_pointer_backend.py scripts/generate_auth_recovery_codes.py
      - run: python -m ruff check --select E722 src
      - run: python -m ruff check --select E9,E722,F63,F7,F82,B src/captcha_budget.py src/runtime_snapshot_cache.py src/llm_config.py src/llm_model_selector.py src/llm_qualification_runtime.py src/llm_qualification_pool.py src/llm_qualification_store.py src/llm_evidence_prompt.py src/storage/migration_metadata.py alembic/env.py tools/collection_runtime_proxy.py scripts/quality_suites.py scripts/run_quality_tests.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/collection_http_server.py tools/run_isolated_collection_api.py tools/test/test_collection_api_tls.py tools/test/test_collection_http_server_concurrency.py
      - run: python -m ruff format --check src/collection_http_server.py tools/run_isolated_collection_api.py tools/test/test_collection_api_tls.py tools/test/test_collection_http_server_concurrency.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/archive_json_io.py src/collection_jobs.py src/collection_maintenance_jobs.py tools/test/collection_job_checks.py tools/test/test_collection_jobs.py tools/test/test_collection_job_http.py tools/test/test_archive_json_preservation.py tools/test/test_server_source_contract.py
      - run: python -m ruff format --check src/archive_json_io.py src/collection_jobs.py src/collection_maintenance_jobs.py tools/test/collection_job_checks.py tools/test/test_collection_jobs.py tools/test/test_collection_job_http.py tools/test/test_archive_json_preservation.py tools/test/test_server_source_contract.py
      - run: python -m mypy --strict --follow-imports skip src/collection_http_server.py src/collection_jobs.py src/collection_maintenance_jobs.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B src/solver_execution_state.py tools/test/test_server_solver_run_ownership.py tools/test/test_manual_review_job_http.py tools/test/test_report_job_http.py
      - run: python -m ruff format --check src/solver_execution_state.py tools/test/test_server_solver_run_ownership.py tools/test/test_manual_review_job_http.py tools/test/test_report_job_http.py
      - run: python -m mypy --strict --follow-imports skip src/solver_execution_state.py
      - run: python -m ruff check --select E9,E722,F63,F7,F82,B src/server_routes.py src/storage/seed_scan_candidates.py src/storage/repository_seed_scan_pages.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B --config 'include=["**/repository_*.py"]' --exclude 'repository_context.py' src/storage
      - run: python -m ruff format --check src/server_routes.py src/storage/seed_scan_candidates.py tools/test/test_seed_candidate_windows.py
      - run: python -m ruff check --select I,F401,F403,F405,F821,E9,E722,F63,F7,B tools/test/test_search_claim_streaming.py
      - run: python -m ruff format --check tools/test/test_search_claim_streaming.py
      - run: python -m mypy --strict --follow-imports skip src/captcha_budget.py src/llm_evidence_prompt.py scripts/quality_suites.py src/server_routes.py src/storage/seed_scan_candidates.py
      - run: python scripts/run_quality_tests.py --suite fast
      - run: python scripts/run_quality_tests.py --suite security
      - run: python scripts/run_quality_tests.py --suite postgres
        env:
          CROW_TEST_POSTGRES_URL: postgresql+psycopg://quality:isolated_ci_only@127.0.0.1:5432/crow_quality
      - run: node --test scripts/tests/effective-code-lines.test.mjs scripts/tests/build-userscript.test.mjs scripts/tests/userscript-generated-gate.test.mjs scripts/tests/userscript-api.test.mjs
      - run: node scripts/effective-code-lines.mjs --mode ratchet --json artifacts/effective-code-lines.json
      - run: git diff --check
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: rustup show active-toolchain
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  desktop-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
        working-directory: collector-desktop
      - run: npx playwright install --with-deps chromium
        working-directory: collector-desktop
      - run: npm run test:smoke
        working-directory: collector-desktop
