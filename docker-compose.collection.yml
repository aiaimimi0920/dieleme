x-fapaifang-image: &fapaifang-image
  build:
    context: .
    args:
      PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.10-slim}
  env_file:
    - path: docker.local.env
      required: false
  image: fapaifang-collector:local

x-fapaifang-volumes: &fapaifang-volumes
  - fapaifang-output:/data/output
  - fapaifang-datas:/data/datas
  - fapaifang-jobs:/data/jobs
  - fapaifang-secrets:/data/secrets

services:
  fapaifang-seed-collector:
    <<: *fapaifang-image
    container_name: fapaifang-seed-collector
    restart: ${FAPAI_SEED_COLLECTOR_RESTART:-unless-stopped}
    environment:
      FAPAI_RUN_MODE: seed-collector
      FAPAI_OUTPUT_DIR: /data/output/seed_collector
      FAPAI_API_BASE_URL: ${FAPAI_API_BASE_URL:-http://fapaifang-api:8001/api}
      FAPAI_DB_URL: ${FAPAI_WORKER_DB_URL:-postgresql+psycopg://fapaifang:fapaifang@postgres:5432/fapaifang}
      FAPAI_DB_SCHEMA_GUARD: ${FAPAI_WORKER_DB_SCHEMA_GUARD:-0}
      FAPAI_DB_AUTO_CREATE: ${FAPAI_WORKER_DB_AUTO_CREATE:-0}
      FAPAI_DB_ENABLE_POSTGIS: ${FAPAI_WORKER_DB_ENABLE_POSTGIS:-0}
      FAPAI_SEED_JOB_KEY: ${FAPAI_SEED_JOB_KEY:-guangdong-guangzhou-nansha-50025969}
      FAPAI_SEED_PROVINCE: ${FAPAI_SEED_PROVINCE:-广东省}
      FAPAI_SEED_CITY: ${FAPAI_SEED_CITY:-广州市}
      FAPAI_SEED_DISTRICT: ${FAPAI_SEED_DISTRICT:-南沙区}
      FAPAI_SEED_LOCATION_CODE: ${FAPAI_SEED_LOCATION_CODE:-440115}
      FAPAI_SEED_CATEGORY: ${FAPAI_SEED_CATEGORY:-50025969}
      FAPAI_SEED_SORTS: ${FAPAI_SEED_SORTS:-sort_0:0:默认排序,sort_3:3:价格由高到低,bid_desc:2:出价次数由高到低,end_time_soon:1:结拍时间由近到远,sort_4:4:排序4,sort_5:5:排序5}
      FAPAI_SEED_MAX_PAGE: ${FAPAI_SEED_MAX_PAGE:-83}
      FAPAI_SEED_PAGES_PER_RUN: ${FAPAI_SEED_PAGES_PER_RUN:-20}
      FAPAI_SEED_LOOP_INTERVAL_SECONDS: ${FAPAI_SEED_LOOP_INTERVAL_SECONDS:-60}
      FAPAI_SEED_WORKER_ID: ${FAPAI_SEED_WORKER_ID:-seed-1}
      FAPAI_SEED_JOBS_FILE: ${FAPAI_SEED_JOBS_FILE:-}
      FAPAI_SEED_JOBS_JSON: ${FAPAI_SEED_JOBS_JSON:-}
      FAPAI_SEED_PARALLEL_SORTS: ${FAPAI_SEED_PARALLEL_SORTS:-1}
    volumes: *fapaifang-volumes

