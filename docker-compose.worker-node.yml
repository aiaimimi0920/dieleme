x-worker-node-env: &worker-node-env
  FAPAI_NODE_ID: ${FAPAI_NODE_ID:?set FAPAI_NODE_ID}
  FAPAI_API_BASE_URL: ${FAPAI_CENTRAL_API_BASE_URL:-http://192.168.15.200:8001/api}
  FAPAI_DB_URL: ${FAPAI_WORKER_DB_URL:-postgresql+psycopg://fapaifang:fapaifang@192.168.15.200:55432/fapaifang}
  FAPAI_CDP_ENDPOINT: ${FAPAI_CDP_ENDPOINT:-http://host.docker.internal:9223}
  FAPAI_COOKIE_SNAPSHOT: /data/secrets/nodes/${FAPAI_NODE_ID:?set FAPAI_NODE_ID}/taobao-cookies.json
  FAPAI_COOKIE_SNAPSHOT_PREFER: ${FAPAI_COOKIE_SNAPSHOT_PREFER:-1}
  FAPAI_LIST_BROWSER_FALLBACK: ${FAPAI_LIST_BROWSER_FALLBACK:-1}
  FAPAI_CAPTCHA_SOLVER_ENABLED: ${FAPAI_CAPTCHA_SOLVER_ENABLED:-1}
  FAPAI_SEED_AUTH_PROBE_INTERVAL_SECONDS: ${FAPAI_SEED_AUTH_PROBE_INTERVAL_SECONDS:-60}

x-worker-node-seed-env: &worker-node-seed-env
  <<: *worker-node-env
  FAPAI_LIST_BROWSER_FALLBACK: ${FAPAI_SEED_LIST_BROWSER_FALLBACK:-0}
  FAPAI_CAPTCHA_SOLVER_ENABLED: ${FAPAI_SEED_CAPTCHA_SOLVER_ENABLED:-0}

x-worker-node-detail-env: &worker-node-detail-env
  <<: *worker-node-env
  FAPAI_CDP_ENDPOINT: ${FAPAI_DETAIL_CDP_ENDPOINT:-http://127.0.0.1:1}
  FAPAI_CAPTCHA_SOLVER_ENABLED: ${FAPAI_DETAIL_CAPTCHA_SOLVER_ENABLED:-0}
  FAPAI_DETAIL_TARGET_SUCCESS: ${FAPAI_WORKER_NODE_DETAIL_TARGET_SUCCESS:-10}
  FAPAI_DETAIL_MAX_ATTEMPTS: ${FAPAI_WORKER_NODE_DETAIL_MAX_ATTEMPTS:-30}
  FAPAI_DETAIL_LOOP_INTERVAL_SECONDS: ${FAPAI_WORKER_NODE_DETAIL_LOOP_INTERVAL_SECONDS:-30}
  FAPAI_DETAIL_ACTIVE_LOOP_INTERVAL_SECONDS: ${FAPAI_WORKER_NODE_DETAIL_ACTIVE_LOOP_INTERVAL_SECONDS:-30}
  FAPAI_DETAIL_LOAD_OPEN_BROWSER_PAGES: ${FAPAI_WORKER_NODE_DETAIL_LOAD_OPEN_BROWSER_PAGES:-0}
  FAPAI_DETAIL_BROWSER_FALLBACK: ${FAPAI_WORKER_NODE_DETAIL_BROWSER_FALLBACK:-0}
  # /data/datas 是下面必挂的 bind，所以这里默认打开 raw detail 持久归档。
  # 代码层是 opt-in，但漏配一个变量就会让归档静默失效，而缺归档原料正是
  # 历史上 228,959 行风险字段无法回填的原因。
  FAPAI_DETAIL_ARCHIVE_ROOT: ${FAPAI_DETAIL_ARCHIVE_ROOT:-/data/datas}

x-worker-node-volumes: &worker-node-volumes
  - type: bind
    source: ${FAPAI_SHARED_DATA_ROOT_HOST:?set FAPAI_SHARED_DATA_ROOT_HOST}/output
    target: /data/output
  - type: bind
    source: ${FAPAI_SHARED_DATA_ROOT_HOST:?set FAPAI_SHARED_DATA_ROOT_HOST}/datas
    target: /data/datas
  - type: bind
    source: ${FAPAI_SHARED_DATA_ROOT_HOST:?set FAPAI_SHARED_DATA_ROOT_HOST}/jobs
    target: /data/jobs
  - type: bind
    source: ${FAPAI_SHARED_DATA_ROOT_HOST:?set FAPAI_SHARED_DATA_ROOT_HOST}/secrets
    target: /data/secrets
    read_only: true

services:
  fapaifang-seed-collector:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-seed-collector-2:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-seed-collector-3:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-seed-collector-4:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-seed-collector-5:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-seed-collector-6:
    environment: *worker-node-seed-env
    volumes: *worker-node-volumes

  fapaifang-detail-worker:
    environment: *worker-node-detail-env
    volumes: *worker-node-volumes

  fapaifang-detail-worker-2:
    environment: *worker-node-detail-env
    volumes: *worker-node-volumes

  fapaifang-detail-worker-3:
    environment: *worker-node-detail-env
    volumes: *worker-node-volumes

  fapaifang-detail-analysis-worker:
    environment: *worker-node-env
    volumes: *worker-node-volumes

  fapaifang-detail-analysis-worker-2:
    environment: *worker-node-env
    volumes: *worker-node-volumes

  fapaifang-detail-analysis-worker-3:
    environment: *worker-node-env
    volumes: *worker-node-volumes
