[pytest]
testpaths =
    tests
    tools/test
markers =
    security: negative tests for security boundaries and data preservation
    unit: explicit hermetic unit tests with no live components
    desktop: desktop transport and UI contracts
    quick: explicitly selected bounded offline tests
    integration: tests that exercise multiple runtime components through local boundaries
    stateful: tests that mutate module globals, background managers, or persisted state
    slow: tests with polling, solver, or asynchronous job lifecycles
    live_network: tests that intentionally require non-loopback network access and are skipped by default
